name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install --yes mpv ripgrep sqlite3
      - run: mise run test
      - run: mise run smoke
