name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Install system release dependencies
        run: sudo apt-get update && sudo apt-get install --yes mpv ripgrep sqlite3
      - name: Configure headless audio
        run: |
          mkdir -p "${HOME}/.config/mpv"
          printf '%s\n' 'ao=sdl' > "${HOME}/.config/mpv/mpv.conf"
      - name: Verify tag matches the application version
        shell: bash
        run: |
          package_version=$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)",$/\1/p' tui/package.json)
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Build and verify release
        run: mise run release:check
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/auditui-linux-x86_64.tar.gz
          dist/auditui-linux-x86_64.tar.gz.sha256
          --verify-tag
          --generate-notes
          --title "Auditui ${GITHUB_REF_NAME}"
