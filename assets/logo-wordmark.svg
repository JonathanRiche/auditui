<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Auditui">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a23c"/>
      <stop offset="1" stop-color="#ff6b3d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="48" fill="#0d1017"/>
  <!-- icon, borderless -->
  <g transform="translate(40 40)">
    <rect width="240" height="240" rx="40" fill="#141821"/>
    <circle cx="34" cy="34" r="6" fill="#ff5f57"/><circle cx="54" cy="34" r="6" fill="#febc2e"/><circle cx="74" cy="34" r="6" fill="#28c840"/>
    <path d="M40 96 L80 150 L40 204" fill="none" stroke="#e6e9f0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="url(#wave)">
      <rect x="104" y="142" width="12" height="16" rx="6"/>
      <rect x="123" y="126" width="12" height="48" rx="6"/>
      <rect x="142" y="104" width="12" height="92" rx="6"/>
      <rect x="161" y="88" width="12" height="124" rx="6"/>
      <rect x="180" y="82" width="12" height="136" rx="6" fill="#e6e9f0"/>
      <rect x="199" y="88" width="12" height="124" rx="6"/>
      <rect x="218" y="104" width="12" height="92" rx="6"/>
    </g>
  </g>
  <!-- wordmark: mono, with the "i" dots coloured like the wave -->
  <text x="330" y="205" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace"
        font-size="168" font-weight="700" fill="#e6e9f0" letter-spacing="-6">audit<tspan fill="url(#wave)">ui</tspan></text>
  <text x="336" y="262" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace"
        font-size="30" fill="#8b93a7" letter-spacing="4">$ audiobooks in your terminal_</text>
</svg>
