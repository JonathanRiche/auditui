<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Auditui logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a23c"/>
      <stop offset="1" stop-color="#ff6b3d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6b3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff6b3d" stop-opacity=".18"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="24" y="24" width="464" height="464" rx="56" fill="url(#bg)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="56" fill="none" stroke="#3a4152" stroke-width="3"/>

  <!-- title bar -->
  <circle cx="76" cy="76" r="11" fill="#ff5f57"/>
  <circle cx="112" cy="76" r="11" fill="#febc2e"/>
  <circle cx="148" cy="76" r="11" fill="#28c840"/>
  <line x1="48" y1="112" x2="464" y2="112" stroke="#3a4152" stroke-width="3"/>

  <!-- prompt chevron doubling as a play button -->
  <path d="M92 196 L172 300 L92 404" fill="none" stroke="#e6e9f0" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- waveform bars: the silhouette of an open book, spine in the middle -->
  <g fill="url(#wave)">
    <rect x="216" y="286" width="22" height="28" rx="11"/>
    <rect x="252" y="256" width="22" height="88" rx="11"/>
    <rect x="288" y="216" width="22" height="168" rx="11"/>
    <rect x="324" y="186" width="22" height="228" rx="11"/>
    <!-- spine -->
    <rect x="360" y="176" width="22" height="248" rx="11" fill="#e6e9f0"/>
    <rect x="396" y="186" width="22" height="228" rx="11"/>
    <rect x="432" y="216" width="22" height="168" rx="11"/>
  </g>


  <!-- blinking cursor -->
  <rect x="204" y="384" width="26" height="40" rx="4" fill="#f6a23c">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
